services:
  db:
    image: postgres:16-alpine
    container_name: fitness-buddy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # libpq-Standardvariablen, damit `docker compose exec db psql ...`
      # ohne -U/-d/Passwort-Prompt funktioniert.
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./backend/data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fitness-buddy-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    # Kein Host-Port mehr — nur intern über Docker-Netz erreichbar.
    # Der edge-Container übernimmt APP_PORT nach außen.
    volumes:
      - ./backend/migrations:/app/migrations:ro
      - ./backend/seeds:/app/seeds:ro

  # Schlanker Reverse-Proxy davor. Übernimmt APP_PORT und zeigt eine gebrandete
  # Wartungsseite, falls der App-Container gerade nicht läuft (z. B. während
  # eines Deploys). Wird fast nie neu gebaut und bleibt daher über App-Deploys
  # hinweg oben — so ist die Wartungsseite immer erreichbar.
  edge:
    image: nginx:alpine
    container_name: fitness-buddy-edge
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./edge/maintenance.html:/usr/share/nginx/html/maintenance.html:ro
    depends_on:
      - app
