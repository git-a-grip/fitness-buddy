server_tokens off;

server {
    listen 80;
    server_name _;

    # Alles an den App-Container durchreichen. Über eine Variable + Docker-
    # Resolver, damit nginx auch dann startet, wenn der App-Container gerade
    # nicht läuft (sonst würde nginx beim Start an der DNS-Auflösung scheitern).
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream http://app:3000;
        proxy_pass $upstream;

        proxy_connect_timeout 3s;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $http_connection;
    }

    # Gebrandete Wartungsseite, wenn der App-Container nicht erreichbar ist.
    # 502 = keine Verbindung, 504 = Timeout — beide erzeugt nginx selbst.
    error_page 502 504 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
    }
}
