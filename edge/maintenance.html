<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <!-- Seite versucht sich alle 20 s neu zu laden — kommt automatisch zurück -->
  <meta http-equiv="refresh" content="20" />
  <title>Gleich zurück · Fitness Buddy</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #420d0d 0%, #832020 100%);
      color: #fae0e0;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .card {
      background: rgba(38,8,8,0.55);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(250,224,224,0.12);
      border-radius: 24px;
      padding: 40px 28px 32px;
      max-width: 420px; width: 100%;
      box-shadow: 0 24px 64px rgba(0,0,0,0.45);
    }
    .dumbbell {
      width: 104px; height: 104px; margin: 0 auto 20px;
      animation: lift 2.4s ease-in-out infinite;
    }
    @keyframes lift { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-8px) rotate(-6deg); } }
    h1 { font-size: 24px; margin: 0 0 10px; color: #f4b8b8; }
    p  { font-size: 15px; line-height: 1.55; margin: 0 0 6px; color: #f0c8c8; }
    .sub { font-size: 13px; color: #d99f9f; margin-top: 18px; }
    .dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #e8b84b; margin: 0 3px; animation: pulse 1.4s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%,100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }
    .lang { margin-top: 14px; font-size: 13px; color: #e0a8a8; }
    .lang span { opacity: 0.6; color: #e8b84b; }
  </style>
</head>
<body>
  <main class="card">
    <svg class="dumbbell" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- Stange -->
      <rect x="18" y="29.5" width="28" height="5" rx="2.5" fill="#e8b84b"/>
      <!-- linke Gewichte -->
      <rect x="11" y="22" width="6" height="20" rx="2.4" fill="#f4b8b8"/>
      <rect x="6"  y="25" width="5" height="14" rx="2.2" fill="#eb8888"/>
      <!-- rechte Gewichte -->
      <rect x="47" y="22" width="6" height="20" rx="2.4" fill="#f4b8b8"/>
      <rect x="53" y="25" width="5" height="14" rx="2.2" fill="#eb8888"/>
      <!-- Glanzpunkt auf der Stange -->
      <rect x="22" y="30.7" width="20" height="1.4" rx="0.7" fill="#fff" opacity="0.5"/>
    </svg>

    <h1>Gleich zurück! 💪</h1>
    <p>Fitness Buddy macht gerade eine kurze Pause &ndash; wir sind in ein paar Augenblicken wieder einsatzbereit.</p>
    <div style="margin-top:16px">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>

    <p class="lang">
      <span>EN —</span> We'll be right back! The app is taking a short break.<br />
      <span>ES —</span> ¡Volvemos enseguida! La app está haciendo una pausa.
    </p>

    <p class="sub">Diese Seite aktualisiert sich automatisch.</p>
  </main>
</body>
</html>
